<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Sin Gluten Drop</title>
<style>
/* ===== Base ===== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:#1e1410;overflow:hidden;touch-action:none;
  font-family:"Trebuchet MS","Arial Rounded MT Bold","Segoe UI",Arial,sans-serif}
body{display:flex;align-items:center;justify-content:center}
/* Contenedor del juego (relación 3:5). --u = 1px lógico, lo ajusta JS */
#wrap{position:relative;overflow:hidden;--u:1px;background:#000;box-shadow:0 0 40px rgba(0,0,0,.6)}
canvas{display:block;width:100%;height:100%;touch-action:none}

/* ===== Pantallas (menú / game over) ===== */
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:calc(var(--u)*10);text-align:center;padding:calc(var(--u)*20);color:#fff;
  background:radial-gradient(circle at 50% 30%,rgba(255,190,90,.95),rgba(214,96,40,.96));z-index:5}
.overlay.hidden,.hidden{display:none!important}
.mascot{height:calc(var(--u)*150);max-width:calc(var(--u)*230);object-fit:contain;
  filter:drop-shadow(0 calc(var(--u)*6) calc(var(--u)*6) rgba(0,0,0,.35));animation:bob 1.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(calc(var(--u)*-8))}}
h1{margin:0;font-size:calc(var(--u)*54);line-height:1;color:#ffe14d;letter-spacing:calc(var(--u)*1);
  text-shadow:0 calc(var(--u)*4) 0 #b3421a,0 calc(var(--u)*8) calc(var(--u)*10) rgba(0,0,0,.35);transform:rotate(-3deg)}
h2{margin:0;font-size:calc(var(--u)*32);line-height:1.1;color:#ffe14d;text-shadow:0 calc(var(--u)*3) 0 #8a2b12}
.foods{font-size:calc(var(--u)*38);letter-spacing:calc(var(--u)*6)}
.tag{margin:0;font-size:calc(var(--u)*19);font-weight:bold;max-width:calc(var(--u)*360);text-shadow:0 calc(var(--u)*2) 0 rgba(0,0,0,.35)}
.btn{font:inherit;font-weight:900;font-size:calc(var(--u)*34);color:#fff;background:linear-gradient(#4fdc6f,#1fa64a);
  border:calc(var(--u)*4) solid #fff;border-radius:calc(var(--u)*40);padding:calc(var(--u)*10) calc(var(--u)*46);
  box-shadow:0 calc(var(--u)*7) 0 #147535,0 calc(var(--u)*12) calc(var(--u)*14) rgba(0,0,0,.3);cursor:pointer;
  text-shadow:0 calc(var(--u)*2) 0 rgba(0,0,0,.3);animation:pulse 1.2s ease-in-out infinite;margin-top:calc(var(--u)*6)}
.btn:active{transform:translateY(calc(var(--u)*4));box-shadow:0 calc(var(--u)*3) 0 #147535}
@keyframes pulse{0%,100%{scale:1}50%{scale:1.06}}
.legend{background:rgba(0,0,0,.28);border-radius:calc(var(--u)*16);padding:calc(var(--u)*10) calc(var(--u)*18);
  font-size:calc(var(--u)*16);font-weight:bold;line-height:1.5;margin-top:calc(var(--u)*6)}
.stats{background:rgba(0,0,0,.28);border-radius:calc(var(--u)*16);padding:calc(var(--u)*12) calc(var(--u)*28);
  font-size:calc(var(--u)*24);font-weight:bold;line-height:1.55}
.stats b{color:#ffe14d}
#newRec{font-size:calc(var(--u)*24);font-weight:900;color:#fff36b;animation:pulse 0.8s ease-in-out infinite}
#overScreen{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}

/* ===== Botón de sonido ===== */
#mute{position:absolute;top:calc(var(--u)*72);right:calc(var(--u)*10);width:calc(var(--u)*40);height:calc(var(--u)*40);
  border-radius:50%;border:calc(var(--u)*2) solid rgba(255,255,255,.7);background:rgba(40,25,15,.55);
  font-size:calc(var(--u)*20);line-height:1;color:#fff;cursor:pointer;z-index:4;padding:0}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <button id="mute" aria-label="Sonido">🔊</button>

  <!-- Pantalla inicial -->
  <div id="startScreen" class="overlay">
    <img id="imgStart" class="mascot" alt="Mascota">
    <h1>SIN GLUTEN<br>DROP</h1>
    <div class="foods">🍎 🍚 🥑 🥖</div>
    <p class="tag">¡Atrapa la comida sin gluten y evita el pan y la harina!</p>
    <button id="btnPlay" class="btn">JUGAR</button>
    <div class="legend"><div>🟢 Atrapa la comida.</div><div>🔴 Evita el pan y los sacos de harina.</div></div>
  </div>

  <!-- Game over -->
  <div id="overScreen" class="overlay hidden">
    <h2>¡CUIDADO CON EL<br>GLUTEN! 😵</h2>
    <img id="imgDead" class="mascot" alt="Game over">
    <div class="stats">
      <div>Puntuación: <b id="sScore">0</b></div>
      <div>Récord: <b id="sBest">0</b></div>
      <div>Combo máximo: <b id="sCombo">x0</b></div>
    </div>
    <div id="newRec" class="hidden">🏆 ¡NUEVO RÉCORD!</div>
    <button id="btnAgain" class="btn">JUGAR DE NUEVO</button>
  </div>
</div>

/* =====================================================================
   3. AUDIO (Web Audio API, opcional)
   ===================================================================== */
let actx = null, muted = false;
function initAudio() {
  try {
    if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) actx = new AC();
  } catch (e) { actx = null; }
}
function tone(f, d, type = 'sine', v = .15, slide = 0, delay = 0) {
  if (!actx || muted) return;
  try {
    const t = actx.currentTime + delay;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t + d + .02);
  } catch (e) {}
}
const sfx = {
  eat(s)  { const b = 520 + Math.min(s, 12) * 35; tone(b, .1, 'triangle', .18, 220); tone(b * 1.5, .12, 'sine', .1, 0, .06); },
  hit()   { tone(240, .35, 'sawtooth', .2, -170); tone(120, .3, 'square', .1, -60, .05); },
  star()  { [660, 880, 1100, 1320, 1760].forEach((f, i) => tone(f, .18, 'triangle', .16, 0, i * .07)); },
  over()  { [420, 340, 260, 170].forEach((f, i) => tone(f, .3, 'sawtooth', .16, -40, i * .22)); },
  start() { [440, 660, 880].forEach((f, i) => tone(f, .12, 'triangle', .15, 0, i * .08)); },
  level() { tone(600, .1, 'square', .08); tone(900, .15, 'square', .08, 0, .1); }
};

/* =====================================================================
   4. UTILIDADES DE DIBUJO
   ===================================================================== */
function rr(c, x, y, w, h, r) {           // rectángulo redondeado
  c.beginPath(); c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function text(t, x, y, size, fill, align = 'center', stroke = 'rgba(0,0,0,.65)', lw = 4) {
  ctx.font = `900 ${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  if (stroke) { ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.strokeText(t, x, y); }
  ctx.fillStyle = fill; ctx.fillText(t, x, y);
}
function emoji(e, x, y, size) {
  ctx.font = `${size}px ${EMOJI}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#000'; ctx.fillText(e, x, y);
}
function pill(x, y, w, h, color, label, size) {   // sello con texto
  rr(ctx, x - w / 2, y - h / 2, w, h, h / 2); ctx.fillStyle = color; ctx.fill();
  ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.stroke();
  text(label, x, y + 0.5, size, '#fff', 'center', null);
}
function starPath(c, cx, cy, R, r) {
  c.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5, rad = i % 2 ? r : R;
    c[i ? 'lineTo' : 'moveTo'](cx + Math.cos(a) * rad, cy + Math.sin(a) * rad);
  }
  c.closePath();
}

  });
  // repisa con frascos
  b.fillStyle = '#a5652d'; rr(b, 20, 302, 290, 12, 4); b.fill();
  b.fillStyle = '#7c4a20'; b.beginPath(); b.moveTo(40, 314); b.lineTo(70, 314); b.lineTo(40, 338); b.fill();
  b.beginPath(); b.moveTo(260, 314); b.lineTo(290, 314); b.lineTo(290, 338); b.fill();
  [['#f4d35e', 38], ['#ee964b', 96], ['#f95738', 154], ['#7bc47f', 212]].forEach(([c, x]) => {
    b.fillStyle = 'rgba(255,255,255,.55)'; rr(b, x, 254, 44, 48, 8); b.fill();
    b.fillStyle = c; rr(b, x + 3, 272, 38, 27, 6); b.fill();
    b.fillStyle = '#8a5a2c'; rr(b, x + 6, 246, 32, 10, 3); b.fill();
  });
  b.fillStyle = '#b5673b'; rr(b, 262, 272, 34, 30, 5); b.fill();   // maceta
  b.fillStyle = '#4caf50';
  [[279, 262, 12], [268, 268, 9], [290, 268, 9]].forEach(([x, y, r]) => { b.beginPath(); b.arc(x, y, r, 0, 7); b.fill(); });
  // mesón
  g = b.createLinearGradient(0, 728, 0, 800); g.addColorStop(0, '#c07a40'); g.addColorStop(1, '#8e5226');
  b.fillStyle = g; b.fillRect(0, 728, W, 72);
  b.fillStyle = '#e8ad70'; b.fillRect(0, 728, W, 22);
  b.fillStyle = 'rgba(255,255,255,.35)'; b.fillRect(0, 728, W, 3);
  b.fillStyle = 'rgba(0,0,0,.2)'; b.fillRect(0, 750, W, 3);
  b.strokeStyle = 'rgba(90,50,20,.22)'; b.lineWidth = 1.5;
  for (let i = 0; i < 12; i++) { b.beginPath(); b.moveTo(i * 44, 732 + (i % 3) * 5); b.lineTo(i * 44 + 34, 734 + (i % 3) * 5); b.stroke(); }
  b.fillStyle = '#a3612f'; rr(b, 26, 760, 190, 34, 6); b.fill(); rr(b, 264, 760, 190, 34, 6); b.fill();
  b.fillStyle = '#f3d38a'; b.beginPath(); b.arc(121, 777, 5, 0, 7); b.arc(359, 777, 5, 0, 7); b.fill();
})();

/* =====================================================================
   6. DIFICULTAD PROGRESIVA
   ===================================================================== */
const spawnInterval = () => Math.max(0.42, 1.15 - level * 0.06);   // más objetos
const fallSpeed     = () => Math.min(360, 140 + level * 16);       // más velocidad
const badProb       = () => Math.min(0.45, 0.20 + level * 0.025);  // más pan/harina
const comboMult = s => s < 2 ? 1 : s === 2 ? 1.2 : s === 3 ? 1.5 : s === 4 ? 2 : Math.min(3, 2 + (s - 4) * 0.25);

/* =====================================================================
   7. OBJETOS
   ===================================================================== */
function makeItem(type, x) {
  const it = { type, x, y: -60, phase: Math.random() * 6.28, rot: (Math.random() - .5) * .4, vr: (Math.random() - .5) * 1.2 };
  let s = fallSpeed() * (0.9 + Math.random() * 0.25);
  if (type === 'good') {
    const f = FOODS[Math.floor(Math.random() * FOODS.length)];
    it.e = f.e; it.pts = f.pts; it.r = 25; it.seal = !!f.choco || Math.random() < 0.28; it.choco = !!f.choco;
  } else if (type === 'bread') { it.r = 27; }
  else if (type === 'sack')   { it.r = 34; s *= 0.8; it.face = SACK_FACES[Math.floor(Math.random() * 3)]; }   // más grande y lento
  else if (type === 'star')   { it.r = 30; s *= 0.85; }
  it.vy = s;
  return it;
}
function pickX() {                       // evita repetir la misma columna
  let x, n = 0;
  do { x = 44 + Math.random() * (W - 88); n++; } while (Math.abs(x - lastX) < 90 && n < 12);
  lastX = x; return x;
}
function spawn() {
  const x = pickX();
  let type;
  if (!items.some(i => i.type === 'star') && time - lastStar > 14 && Math.random() < 0.07) { type = 'star'; lastStar = time; }
  else if (badRun < 2 && Math.random() < badProb()) type = Math.random() < 0.5 ? 'bread' : 'sack';
  else type = 'good';
  badRun = (type === 'bread' || type === 'sack') ? badRun + 1 : 0;
  items.push(makeItem(type, x));
  // niveles altos: a veces cae un segundo objeto (siempre bueno y lejos del primero)
  if (level >= 4 && Math.random() < Math.min(0.35, level * 0.04)) {
    let x2 = (x < W / 2) ? x + 140 + Math.random() * 100 : x - 140 - Math.random() * 100;
    x2 = Math.max(44, Math.min(W - 44, x2));
    const it2 = makeItem('good', x2); it2.y = -110; items.push(it2); badRun = 0;
  }
}

function drawSack(it) {
  ctx.save(); ctx.translate(it.x, it.y); ctx.rotate(Math.sin(time * 3 + it.phase) * 0.12);
  ctx.fillStyle = 'rgba(255,50,50,.28)'; ctx.beginPath(); ctx.arc(0, 0, 50, 0, 7); ctx.fill();
  // cuerpo
  ctx.beginPath(); ctx.moveTo(-18, -32);
  ctx.bezierCurveTo(-42, -18, -40, 30, -27, 38); ctx.quadraticCurveTo(0, 45, 27, 38);
  ctx.bezierCurveTo(40, 30, 42, -18, 18, -32); ctx.closePath();
  ctx.fillStyle = '#f2deb0'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = '#8a6231'; ctx.lineJoin = 'round'; ctx.stroke();
  // boca del saco (arrugas)
  ctx.beginPath(); ctx.moveTo(-18, -32); ctx.lineTo(-25, -46); ctx.lineTo(-10, -38); ctx.lineTo(-1, -49);
  ctx.lineTo(8, -38); ctx.lineTo(22, -46); ctx.lineTo(18, -32); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = '#b0472a'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(-19, -32); ctx.lineTo(19, -32); ctx.stroke();
  emoji(it.face, 0, -14, 22);
  text('HARINA', 0, 8, 15, '#b33a1f', 'center', '#fff8e6', 3);
  text('DE TRIGO', 0, 20, 8, '#7a5526', 'center', null);
  // espiga de trigo
  ctx.strokeStyle = '#c99a2e'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(0, 36); ctx.lineTo(0, 26); ctx.stroke();
  ctx.fillStyle = '#e0b13a';
  for (let i = 0; i < 3; i++) {
    ctx.beginPath(); ctx.ellipse(-3, 27 + i * 3, 3, 1.6, -.6, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(3, 27 + i * 3, 3, 1.6, .6, 0, 7); ctx.fill();
  }
  ctx.restore();
}
function drawItem(it) {
  if (it.type === 'sack') return drawSack(it);
  ctx.save(); ctx.translate(it.x, it.y);
  if (it.type === 'good') {
    ctx.fillStyle = 'rgba(90,230,130,.25)'; ctx.beginPath(); ctx.arc(0, 0, 34, 0, 7); ctx.fill();
    ctx.save(); ctx.rotate(it.rot + Math.sin(time * 2 + it.phase) * .15); emoji(it.e, 0, 0, 50); ctx.restore();
    if (it.seal) it.choco ? pill(0, 33, 70, 14, '#1f9d4a', 'SIN GLUTEN', 9) : pill(0, 33, 82, 14, '#1f9d4a', '✓ SIN GLUTEN', 9);
  } else if (it.type === 'bread') {
    ctx.fillStyle = 'rgba(255,50,50,.28)'; ctx.beginPath(); ctx.arc(0, 0, 38, 0, 7); ctx.fill();
    ctx.save(); ctx.rotate(it.rot + Math.sin(time * 4 + it.phase) * .2); emoji('🍞', 0, 0, 56); ctx.restore();
    pill(0, 34, 62, 15, '#d8322b', 'GLUTEN', 10);
  } else if (it.type === 'star') {
    const p = 1 + Math.sin(time * 8) * .1;
    ctx.fillStyle = 'rgba(255,240,120,.35)'; ctx.beginPath(); ctx.arc(0, 0, 46 * p, 0, 7); ctx.fill();
    ctx.save(); ctx.rotate(Math.sin(time * 3) * .2); ctx.scale(p, p);
    starPath(ctx, 0, 0, 32, 14); ctx.fillStyle = '#ffd400'; ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = '#ff9800'; ctx.lineJoin = 'round'; ctx.stroke();
    ctx.restore();
    pill(0, 38, 72, 14, '#1f9d4a', 'SIN GLUTEN', 9);
  }
  ctx.restore();
}

/* =====================================================================
   8. EFECTOS
   ===================================================================== */
function burst(x, y, n, colors, spd = 220, star = false) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.28, v = spd * (.3 + Math.random() * .8);
    particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 80, life: .6 + Math.random() * .4, max: 1,
      size: 3 + Math.random() * 5, color: colors[Math.floor(Math.random() * colors.length)], star });
  }
}
function floatText(t, x, y, color, size = 30) { floats.push({ t, x, y, color, size, life: 1 }); }

/* =====================================================================
   9. ESTADO DE PARTIDA
   ===================================================================== */
function startGame() {
  initAudio(); sfx.start();
  score = 0; lives = 3; streak = 0; maxStreak = 0; level = 0;
  items = []; particles = []; floats = [];
  spawnT = 0.6; badRun = 0; lastStar = time; lastX = -999;
  eatT = hurtT = hitFlash = shakeT = comboPop = bonusT = starFlash = facePop = dyingT = levelBanner = 0;
  player.x = player.tx = W / 2; prevFace = 'normal';
  startScreen.classList.add('hidden'); overScreen.classList.add('hidden');
  state = 'play';
}
function endGame() {
  state = 'dying'; dyingT = 1.4; sfx.over();
  let rec = false;
  if (score > best) { best = score; rec = true; try { localStorage.setItem(REC_KEY, String(best)); } catch (e) {} }
  document.getElementById('sScore').textContent = score;
  document.getElementById('sBest').textContent = best;
  document.getElementById('sCombo').textContent = 'x' + maxStreak;
  document.getElementById('newRec').classList.toggle('hidden', !rec);
}
function catchItem(it) {
  if (it.type === 'star') {
    score += 50; bonusT = 8; starFlash = 1; sfx.star(); eatT = .3;
    burst(it.x, it.y, 40, ['#ffd400', '#fff36b', '#ff9800', '#ffffff'], 340, true);
    floatText('+50 ⭐', it.x, it.y - 20, '#ffe14d', 36);
    return;
  }
  streak++; if (streak > maxStreak) maxStreak = streak; comboPop = 1;
  let pts = Math.round(it.pts * comboMult(streak)); if (bonusT > 0) pts *= 2;
  score += pts; eatT = .3; sfx.eat(streak);
  burst(it.x, it.y, 12, ['#ffd54a', '#7be07b', '#ff8a65', '#fff'], 200);
  floatText('+' + pts, it.x, it.y - 20, bonusT > 0 ? '#ffe14d' : '#7dff8f', 30);
}
function hitItem(it) {
  lives--; streak = 0; hurtT = .55; hitFlash = .6; shakeT = .35; sfx.hit();
  burst(it.x, it.y, 16, ['#ff4d4d', '#c62828', '#f2deb0'], 260);
  floatText('-1 ❤️', player.x, FEET - 170, '#ff5a5a', 36);
  if (lives <= 0) endGame();
}
function currentFace() {
  if (state === 'dying' || state === 'over' || lives <= 0) return 'dead';
  if (streak > 10) return 'mas10';       // más de 10 alimentos seguidos sin fallar
  if (lives < 3) return 'primer';        // se equivocó al menos una vez
  return 'normal';
}

/* =====================================================================
   10. ACTUALIZACIÓN
   ===================================================================== */
const keys = {};
function update(dt) {
  time += dt;
  if (state === 'menu' || state === 'over') { return; }

  // timers de efectos
  eatT = Math.max(0, eatT - dt); hurtT = Math.max(0, hurtT - dt); hitFlash = Math.max(0, hitFlash - dt);
  shakeT = Math.max(0, shakeT - dt); comboPop = Math.max(0, comboPop - dt * 4); starFlash = Math.max(0, starFlash - dt * 2.5);
  facePop = Math.max(0, facePop - dt * 3); levelBanner = Math.max(0, levelBanner - dt);
  particles.forEach(p => { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 600 * dt; });
  particles = particles.filter(p => p.life > 0);
  floats.forEach(f => { f.life -= dt * 1.1; f.y -= 60 * dt; });
  floats = floats.filter(f => f.life > 0);

  if (state === 'dying') {
    dyingT -= dt;
    if (dyingT <= 0) { state = 'over'; overScreen.classList.remove('hidden'); }
    return;
  }

  // movimiento del personaje (teclado + táctil)
  const dir = (keys['arrowright'] || keys['d'] ? 1 : 0) - (keys['arrowleft'] || keys['a'] ? 1 : 0);
  if (dir) player.tx += dir * 560 * dt;
  player.tx = Math.max(60, Math.min(W - 60, player.tx));
  player.x += (player.tx - player.x) * Math.min(1, dt * 14);
  if (bonusT > 0) bonusT = Math.max(0, bonusT - dt);

  // nivel por puntuación
  const lv = Math.floor(score / 250);
  if (lv > level) { level = lv; levelBanner = 1.4; sfx.level(); }

  // aparición de objetos
  spawnT -= dt;
  if (spawnT <= 0) { spawn(); spawnT = spawnInterval() * (0.85 + Math.random() * 0.4); }

  // objetos: movimiento y colisiones
  const bx1 = player.x - 48, bx2 = player.x + 48, by1 = FEET - 128, by2 = FEET - 14;
  for (const it of items) {
    it.y += it.vy * dt; it.rot += it.vr * dt;
    const cx = Math.max(bx1, Math.min(it.x, bx2)), cy = Math.max(by1, Math.min(it.y, by2));
    const dx = it.x - cx, dy = it.y - cy;
    if (dx * dx + dy * dy < (it.r * .85) * (it.r * .85)) {
      it.dead = true;
      (it.type === 'bread' || it.type === 'sack') ? hitItem(it) : catchItem(it);
      if (state === 'dying') break;
    } else if (it.y > FEET + 10) it.dead = true;     // llegó abajo: desaparece
  }
  items = items.filter(i => !i.dead);
}

/* =====================================================================
   11. RENDER
   ===================================================================== */
function drawPlayer() {
  const face = currentFace();
  if (face !== prevFace) { facePop = 1; prevFace = face; }
  const img = faces[face];
  ctx.save();
  // sombra
  ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(player.x, FEET - 2, 52, 9, 0, 0, 7); ctx.fill();
  // aura del bonus de estrella
  if (bonusT > 0) {
    ctx.strokeStyle = `rgba(255,224,60,${.5 + Math.sin(time * 10) * .3})`; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(player.x, FEET - 70, 84 + Math.sin(time * 8) * 4, 0, 7); ctx.stroke();
  }
  if (img && img.naturalWidth) {
    const sc = Math.min(150 / img.naturalWidth, 150 / img.naturalHeight);
    const w = img.naturalWidth * sc, h = img.naturalHeight * sc;
    let sx = 1, sy = 1 + Math.sin(time * 4) * .015, ox = 0, oy = 0, rot = 0;
    if (eatT > 0) { const t = 1 - eatT / .3, s = Math.sin(t * Math.PI); oy = -s * 26; sy = 1 + .12 * s; sx = 1 - .07 * s; }
    if (hurtT > 0) { const k = hurtT / .55; ox = Math.sin(hurtT * 45) * 9 * k; rot = -.16 * k; sy = .93; sx = 1.05; }
    if (shakeT > 0) ox += Math.sin(time * 60) * 3;
    const pop = 1 + facePop * .18;
    ctx.save(); ctx.translate(player.x + ox, FEET + oy); ctx.rotate(rot); ctx.scale(sx * pop, sy * pop);
    ctx.drawImage(img, -w / 2, -h, w, h);
    ctx.restore();
    // burbujas de expresión
    const top = FEET - h + oy;
    if (eatT > 0) { ctx.globalAlpha = Math.min(1, eatT * 6); emoji('😋', player.x + w / 2 - 6, top + 8, 34); ctx.globalAlpha = 1; }
    if (hurtT > 0) { ctx.globalAlpha = Math.min(1, hurtT * 4); emoji('🤢', player.x + w / 2 - 6, top + 8, 34); ctx.globalAlpha = 1; }
  } else {   // respaldo si la imagen no cargó
    ctx.fillStyle = '#ffb347'; ctx.beginPath(); ctx.arc(player.x, FEET - 60, 55, 0, 7); ctx.fill();
  }
  ctx.restore();
}

function drawHUD() {
  ctx.fillStyle = 'rgba(40,25,15,.6)'; rr(ctx, 8, 8, W - 16, 50, 14); ctx.fill();
  text('PUNTOS: ' + String(score || 0).padStart(4, '0'), 20, 33, 17, '#fff', 'left', null);
  text('RÉCORD: ' + String(Math.max(best, score || 0)).padStart(4, '0'), W - 20, 33, 17, '#ffe14d', 'right', null);
  for (let i = 0; i < 3; i++) emoji(i < lives ? '❤️' : '🖤', W / 2 - 32 + i * 32, 34, 24);
  if (streak >= 2) {
    const s = 1 + comboPop * .5;
    ctx.save(); ctx.translate(16, 88); ctx.scale(s, s);
    text('COMBO x' + streak, 0, 0, 24, '#ffcc33', 'left', '#7a2e00', 5); ctx.restore();
  }
  if (bonusT > 0) text('⭐ BONUS x2  ' + Math.ceil(bonusT) + 's', W - 62, 88, 18, '#fff36b', 'right', '#7a4a00', 4);
}

function render() {
  ctx.drawImage(bg, 0, 0, W, H);
  if (state === 'menu') return;
  ctx.save();
  if (shakeT > 0) ctx.translate((Math.random() - .5) * 8 * (shakeT / .35), (Math.random() - .5) * 6 * (shakeT / .35));
  items.forEach(drawItem);
  drawPlayer();
  particles.forEach(p => {
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life * 2)); ctx.fillStyle = p.color;
    if (p.star) { starPath(ctx, p.x, p.y, p.size * 1.5, p.size * .6); ctx.fill(); }
    else { ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, 7); ctx.fill(); }
  });
  ctx.globalAlpha = 1;
  floats.forEach(f => { ctx.globalAlpha = Math.min(1, f.life * 1.6); text(f.t, f.x, f.y, f.size, f.color, 'center', 'rgba(0,0,0,.75)', 5); });
  ctx.globalAlpha = 1;
  ctx.restore();

  // efectos de pantalla
  if (hitFlash > 0) {
    const g = ctx.createRadialGradient(W / 2, H / 2, 200, W / 2, H / 2, 560);
    g.addColorStop(0, 'rgba(255,0,0,0)'); g.addColorStop(1, `rgba(255,0,0,${hitFlash * 1.1})`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = `rgba(255,0,0,${hitFlash * .25})`; ctx.fillRect(0, 0, W, H);
  }
  if (starFlash > 0) { ctx.fillStyle = `rgba(255,245,160,${starFlash * .45})`; ctx.fillRect(0, 0, W, H); }
  if (state === 'dying' || state === 'over') {
    const p = state === 'over' ? 1 : 1 - dyingT / 1.4;
    ctx.fillStyle = `rgba(20,0,0,${.55 * p})`; ctx.fillRect(0, 0, W, H);
    if (state === 'dying') {
      ctx.save(); ctx.translate(W / 2, 300); ctx.scale(.5 + p * .5, .5 + p * .5); ctx.rotate(-.06);
      text('GAME OVER', 0, 0, 62, '#ff5252', 'center', '#fff', 8); ctx.restore();
    }
  }
  if (levelBanner > 0 && state === 'play') {
    ctx.globalAlpha = Math.min(1, levelBanner * 2); text('¡NIVEL ' + (level + 1) + '!', W / 2, 150, 34, '#fff', 'center', '#e65100', 6); ctx.globalAlpha = 1;
  }
  drawHUD();
}

/* =====================================================================
   12. ENTRADA (teclado y táctil)
   ===================================================================== */
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (['arrowleft', 'arrowright', ' '].includes(k)) e.preventDefault();
  keys[k] = true;
  if ((k === 'enter' || k === ' ') && !e.repeat && (state === 'menu' || state === 'over')) startGame();
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

let dragging = false;
function setTarget(e) {
  const r = canvas.getBoundingClientRect();
  player.tx = Math.max(60, Math.min(W - 60, (e.clientX - r.left) / r.width * W));
}
canvas.addEventListener('pointerdown', e => { dragging = true; try { canvas.setPointerCapture(e.pointerId); } catch (_) {} initAudio(); setTarget(e); });
canvas.addEventListener('pointermove', e => { if (dragging) setTarget(e); });
['pointerup', 'pointercancel'].forEach(t => canvas.addEventListener(t, () => { dragging = false; }));
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });   // evita scroll/zoom en iOS

document.getElementById('btnPlay').addEventListener('click', startGame);
document.getElementById('btnAgain').addEventListener('click', startGame);

/* =====================================================================
   13. RESPONSIVE Y BUCLE PRINCIPAL
   ===================================================================== */
function resize() {
  const vw = window.innerWidth, vh = window.innerHeight;
  let w = Math.min(vw, vh * 0.6), h = w / 0.6;
  if (h > vh) { h = vh; w = h * 0.6; }
  wrap.style.width = w + 'px'; wrap.style.height = h + 'px'; wrap.style.setProperty('--u', (w / W) + 'px');
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
  ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
}
addEventListener('resize', resize); addEventListener('orientationchange', () => setTimeout(resize, 200));
resize();

// estado inicial (para poder dibujar antes de jugar)
score = 0; lives = 3; streak = 0; items = []; particles = []; floats = []; level = 0;
eatT = hurtT = hitFlash = shakeT = comboPop = bonusT = starFlash = facePop = dyingT = levelBanner = 0;

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
